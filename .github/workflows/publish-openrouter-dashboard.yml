name: Publish OpenRouter dashboard

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openrouter-dashboard-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install image converter
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick librsvg2-bin
      - name: Fetch usage and render SVG
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DASHBOARD_SVG: out/openrouter-dashboard.svg
        run: node scripts/generate-openrouter-dashboard.js
      - name: Convert SVG to PNG
        run: convert -background white out/openrouter-dashboard.svg -strip out/openrouter-dashboard.png
      - name: Verify image dimensions
        run: test "$(identify -format '%wx%h' out/openrouter-dashboard.png)" = '1072x1448'
      - name: Publish to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          npx --yes wrangler@4 r2 object put "${R2_BUCKET}/openrouter-dashboard.png" \
            --file out/openrouter-dashboard.png \
            --remote \
            --content-type image/png \
            --cache-control no-cache
