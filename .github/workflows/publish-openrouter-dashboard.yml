name: Publish OpenRouter dashboard

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openrouter-dashboard-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install image converter
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick librsvg2-bin
      - name: Fetch usage and render SVG
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DASHBOARD_SVG: out/openrouter-dashboard.svg
        run: node scripts/generate-openrouter-dashboard.js
      - name: Convert SVG to PNG
        run: convert -background white out/openrouter-dashboard.svg -strip out/openrouter-dashboard.png
      - name: Verify image dimensions
        run: test "$(identify -format '%wx%h' out/openrouter-dashboard.png)" = '1072x1448'
      - name: Publish to Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          : "${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID secret is required}"
          : "${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY secret is required}"
          : "${R2_ACCOUNT_ID:?R2_ACCOUNT_ID secret is required}"
          : "${R2_BUCKET:?R2_BUCKET secret is required}"
          curl --fail --silent --show-error \
            --aws-sigv4 "aws:amz:auto:s3" \
            --user "${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}" \
            --header "Content-Type: image/png" \
            --header "Cache-Control: no-cache" \
            --upload-file out/openrouter-dashboard.png \
            "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com/${R2_BUCKET}/openrouter-dashboard.png"
